<!DOCTYPE html>
<html>
<head>
  <title>💧 Smart Water Quality Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
      background-color: #f0f8ff;
    }
    h1 { font-size: 2.5em; color: #0077b6; }
    #status {
      font-size: 2em;
      margin-top: 20px;
      padding: 20px;
      width: 350px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 15px;
      background-color: lightgray;
      color: black;
      transition: background-color 0.5s, opacity 0.5s;
    }
    .safe { background-color: #4CAF50; color: white; }
    .unsafe { background-color: #E63946; color: white; }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      font-size: 1.2em;
    }
    td, th {
      border: 1px solid #0077b6;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background-color 0.5s;
    }
    th { background-color: #0077b6; color: white; }
    canvas { margin-top: 30px; max-width: 90%; }
  </style>
</head>
<body>
  <h1>💧 Smart Water Quality Monitor</h1>
  <div id="status">Waiting for data...</div>

  <table>
    <tr><th>Parameter</th><th>Value</th></tr>
    <tr><td>Turbidity (NTU)</td><td id="turbidity">--</td></tr>
    <tr><td>pH</td><td id="ph">--</td></tr>
    <tr><td>TDS (ppm)</td><td id="tds">--</td></tr>
    <tr><td>Temperature (°C)</td><td id="temp">--</td></tr>
  </table>

  <!-- Graphs -->
  <canvas id="chartTurbidity"></canvas>
  <canvas id="chartPH"></canvas>
  <canvas id="chartTDS"></canvas>
  <canvas id="chartTemp"></canvas>

  <script>
    const maxDataPoints = 20;
    const labels = Array(maxDataPoints).fill('');
    const turbidityData = Array(maxDataPoints).fill(0);
    const phData = Array(maxDataPoints).fill(7);
    const tdsData = Array(maxDataPoints).fill(0);
    const tempData = Array(maxDataPoints).fill(25);

    // Alerts setup
    let alertActive = false;
    const alertSound = new Audio('https://www.soundjay.com/buttons/sounds/beep-07.mp3');

    // Function to get color for charts
    function getColor(parameter, value) {
      if(parameter === "turbidity") {
        if(value <= 100) return 'green';
        if(value <= 200) return 'yellow';
        return 'red';
      }
      if(parameter === "ph") {
        if(value >= 6.5 && value <= 8.5) return 'green';
        if(value >= 6 && value < 6.5 || value > 8.5 && value <= 9) return 'yellow';
        return 'red';
      }
      if(parameter === "tds") {
        if(value <= 500) return 'green';
        if(value <= 800) return 'yellow';
        return 'red';
      }
      if(parameter === "temperature") {
        if(value >= 20 && value <= 30) return 'green';
        if(value >= 31 && value <= 35) return 'yellow';
        return 'red';
      }
      return 'gray';
    }

    const chartTurbidity = new Chart(document.getElementById('chartTurbidity'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Turbidity (NTU)', data: turbidityData, borderColor: 'green', fill: false }] },
      options: { animation: false, scales: { y: { beginAtZero: true } } }
    });
    const chartPH = new Chart(document.getElementById('chartPH'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'pH', data: phData, borderColor: 'green', fill: false }] },
      options: { animation: false, scales: { y: { min: 0, max: 14 } } }
    });
    const chartTDS = new Chart(document.getElementById('chartTDS'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'TDS (ppm)', data: tdsData, borderColor: 'green', fill: false }] },
      options: { animation: false, scales: { y: { beginAtZero: true } } }
    });
    const chartTemp = new Chart(document.getElementById('chartTemp'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Temperature (°C)', data: tempData, borderColor: 'green', fill: false }] },
      options: { animation: false, scales: { y: { beginAtZero: true } } }
    });

    async function fetchStatus() {
      try {
        const response = await fetch('http://127.0.0.1:5000/status');
        const data = await response.json();

        // Update table values
        document.getElementById('turbidity').innerText = data.turbidity.toFixed(1);
        document.getElementById('ph').innerText = data.ph.toFixed(1);
        document.getElementById('tds').innerText = data.tds.toFixed(1);
        document.getElementById('temp').innerText = data.temperature.toFixed(1);

        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Water Status: " + data.status;
        if(data.status === "Safe") statusDiv.className = "safe";
        else if(data.status === "Unsafe") statusDiv.className = "unsafe";
        else statusDiv.className = "";

        function pushData(arr, value) { arr.push(value); if(arr.length > maxDataPoints) arr.shift(); }
        pushData(labels, new Date().toLocaleTimeString());
        pushData(turbidityData, data.turbidity);
        pushData(phData, data.ph);
        pushData(tdsData, data.tds);
        pushData(tempData, data.temperature);

        chartTurbidity.data.datasets[0].borderColor = getColor("turbidity", data.turbidity);
        chartPH.data.datasets[0].borderColor = getColor("ph", data.ph);
        chartTDS.data.datasets[0].borderColor = getColor("tds", data.tds);
        chartTemp.data.datasets[0].borderColor = getColor("temperature", data.temperature);

        chartTurbidity.update();
        chartPH.update();
        chartTDS.update();
        chartTemp.update();

        // --- Multi-Parameter Alerts & Highlight ---
        const parameters = ["turbidity", "ph", "tds", "temp"];
        const thresholds = {
          turbidity: { safe: 100, caution: 200 },
          ph: { safeLow: 6.5, safeHigh: 8.5, cautionLow: 6, cautionHigh: 9 },
          tds: { safe: 500, caution: 800 },
          temp: { safeLow: 20, safeHigh: 30, cautionLow: 31, cautionHigh: 35 }
        };

        parameters.forEach(param => {
          const cell = document.getElementById(param);
          let value = data[param];
          let unsafe = false;

          if(param === "turbidity") {
            if(value > thresholds.turbidity.caution) unsafe = true;
          } else if(param === "ph") {
            if(value < thresholds.ph.safeLow || value > thresholds.ph.safeHigh) unsafe = true;
          } else if(param === "tds") {
            if(value > thresholds.tds.caution) unsafe = true;
          } else if(param === "temp") {
            if(value < thresholds.temp.safeLow || value > thresholds.temp.cautionHigh) unsafe = true;
          }

          if(unsafe) {
            cell.style.backgroundColor = "#E63946";
            cell.style.color = "white";
            if(!alertActive) {
              alertActive = true;
              alertSound.play();
              alert(`⚠️ ${param.toUpperCase()} is in unsafe range!`);
            }
          } else {
            cell.style.backgroundColor = "";
            cell.style.color = "black";
          }
        });

        // Reset alertActive if all safe
        if(data.status === "Safe") alertActive = false;

      } catch(err) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Error connecting to server";
        statusDiv.className = "";
        console.error(err);
      }
    }

    setInterval(fetchStatus, 2000);
  </script>
</body>
</html>
