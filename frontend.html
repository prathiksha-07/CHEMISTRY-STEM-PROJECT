<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💧 Smart Water Quality Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f8ff;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #0077b6;
      margin: 0 0 20px;
    }

    #status {
      margin: 0 auto 20px;
      padding: 15px;
      width: min(90%, 360px);
      border-radius: 12px;
      background: lightgray;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .safe {
      background: #4caf50;
      color: white;
    }

    .unsafe {
      background: #e63946;
      color: white;
    }

    table {
      margin: 0 auto 20px;
      border-collapse: collapse;
      width: min(90%, 480px);
    }

    td,
    th {
      border: 1px solid #0077b6;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #0077b6;
      color: white;
    }

    canvas {
      max-width: 90%;
      margin: 10px auto;
      display: block;
    }

    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>

<body>
  <h1>💧 Smart Water Quality Monitor</h1>

  <div id="status">Waiting for data...</div>

  <table>
    <tr>
      <th>Parameter</th>
      <th>Value</th>
    </tr>
    <tr>
      <td>Turbidity</td>
      <td id="turbidity">--</td>
    </tr>
    <tr>
      <td>pH</td>
      <td id="ph">--</td>
    </tr>
    <tr>
      <td>TDS</td>
      <td id="tds">--</td>
    </tr>
    <tr>
      <td>Temperature</td>
      <td id="temperature">--</td>
    </tr>
  </table>

  <canvas id="chartTurbidity" height="120"></canvas>
  <canvas id="chartPH" height="120"></canvas>
  <canvas id="chartTDS" height="120"></canvas>
  <canvas id="chartTemp" height="120"></canvas>

  <footer>Updates every 2 seconds. Backend: <code>http://localhost:5000</code></footer>

  <script>
    const API_URL = 'http://127.0.0.1:5000';
    const REFRESH_MS = 2000;

    const chartOptions = {
      animation: false,
      responsive: true,
      plugins: { legend: { display: true } },
      scales: { y: { beginAtZero: true } }
    };

    const labels = [];
    const turbidityData = [];
    const phData = [];
    const tdsData = [];
    const tempData = [];

    function push(arr, value) {
      arr.push(value);
      if (arr.length > 20) arr.shift();
    }

    function getColor(param, value) {
      if (param === 'turbidity') {
        if (value <= 100) return '#2e7d32';
        if (value <= 200) return '#f9a825';
        return '#c62828';
      }
      if (param === 'ph') {
        if (value >= 6.5 && value <= 8.5) return '#2e7d32';
        if (value >= 6 && value <= 9) return '#f9a825';
        return '#c62828';
      }
      if (param === 'tds') {
        if (value <= 500) return '#2e7d32';
        if (value <= 800) return '#f9a825';
        return '#c62828';
      }
      if (param === 'temperature') {
        if (value >= 20 && value <= 30) return '#2e7d32';
        if (value <= 35) return '#f9a825';
        return '#c62828';
      }
      return '#1976d2';
    }

    const chartTurbidity = new Chart(document.getElementById('chartTurbidity'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Turbidity (NTU)', data: turbidityData, borderColor: '#1976d2', fill: false }] },
      options: chartOptions
    });

    const chartPH = new Chart(document.getElementById('chartPH'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'pH', data: phData, borderColor: '#1976d2', fill: false }] },
      options: { ...chartOptions, scales: { ...chartOptions.scales, y: { min: 0, max: 14 } } }
    });

    const chartTDS = new Chart(document.getElementById('chartTDS'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'TDS (ppm)', data: tdsData, borderColor: '#1976d2', fill: false }] },
      options: chartOptions
    });

    const chartTemp = new Chart(document.getElementById('chartTemp'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Temperature (°C)', data: tempData, borderColor: '#1976d2', fill: false }] },
      options: chartOptions
    });

    function setStatus(text, safe) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = text;
      statusEl.className = safe === true ? 'safe' : safe === false ? 'unsafe' : '';
    }

    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}/data`);
        const json = await res.json();

        const turbidity = parseFloat(json.turbidity) || 0;
        const ph = parseFloat(json.ph) || 0;
        const tds = parseFloat(json.tds) || 0;
        const temperature = parseFloat(json.temperature) || 0;

        document.getElementById('turbidity').textContent = turbidity.toFixed(1);
        document.getElementById('ph').textContent = ph.toFixed(2);
        document.getElementById('tds').textContent = tds.toFixed(1);
        document.getElementById('temperature').textContent = temperature.toFixed(1);

        const safe = ph >= 6.5 && ph <= 8.5;
        setStatus(safe ? 'Water is Safe' : 'Water is Unsafe', safe);

        push(labels, new Date().toLocaleTimeString());
        push(turbidityData, turbidity);
        push(phData, ph);
        push(tdsData, tds);
        push(tempData, temperature);

        chartTurbidity.data.datasets[0].borderColor = getColor('turbidity', turbidity);
        chartPH.data.datasets[0].borderColor = getColor('ph', ph);
        chartTDS.data.datasets[0].borderColor = getColor('tds', tds);
        chartTemp.data.datasets[0].borderColor = getColor('temperature', temperature);

        chartTurbidity.update();
        chartPH.update();
        chartTDS.update();
        chartTemp.update();
      } catch (err) {
        console.error(err);
        setStatus('Cannot reach backend', null);
      }
    }

    setInterval(fetchData, REFRESH_MS);
    fetchData();
  </script>
</body>

</html>
